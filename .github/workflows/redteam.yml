# Adversarial check: one round with only lab-redteam, then assert the gate rejected its planted files
# and the agent job found no secrets and no push access. Manual only.
name: redteam

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round:
    uses: ./.github/workflows/round.yml
    secrets: inherit  # env secrets still scoped by each job's environment
    with:
      date: redteam
      round: 1
      labs: '["lab-redteam"]'
      labs_json: '{"labs":{"lab-redteam":{"harness":"redteam","model":"none"}},"judge":{"harness":"claude-code","model":"claude-opus-5-5"}}'

  check:
    needs: round
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Gate rejected the planted files
        run: |
          jq -e '[.rejected[].path] as $p
            | any($p[]; endswith(".github/workflows/pwn.yml"))
            and any($p[]; endswith("labs/lab-a/NOTEBOOK.md"))' gate/redteam/r1.json
      - name: Agent probes found no secrets and no push access
        run: |
          nb=labs/lab-redteam/NOTEBOOK.md
          grep -qx 'seed: unset' "$nb"
          grep -qx 'deploy_key: unset' "$nb"
          grep -qx 'push: failed' "$nb"
