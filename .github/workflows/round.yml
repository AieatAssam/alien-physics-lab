# One research round: agents (per lab), then gate (validate and commit), then sim (physics, commit).
# Called by nightly.yml and redteam.yml. Nothing here triggers on pull requests.
name: round

on:
  workflow_call:
    inputs:
      date:
        type: string
        required: true
      round:
        type: number
        required: true
      labs:
        type: string
        required: true
      labs_json:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  agents:
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(inputs.labs) }}
    runs-on: ubuntu-latest
    environment: agents
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: true
    env:
      DATE: ${{ inputs.date }}
      LABS: ${{ inputs.labs }}
      MODELS_CONFIG: ${{ inputs.labs_json }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install harness CLIs and python deps
        run: |
          npm install -g "@anthropic-ai/claude-code@${{ vars.CLAUDE_CODE_VERSION || 'latest' }}"
          cfg=${MODELS_CONFIG:-$(cat config/models.default.json)}
          if jq -e --argjson labs "$LABS" '[$labs[] as $l | .labs[$l].harness] | index("codex")' <<<"$cfg" >/dev/null; then
            npm install -g "@openai/codex"
          fi
          python -m pip install pyyaml
      - name: Cut the lab off from GitHub and the season site
        # The lab only needs the model API. The checkout above is all the repo it gets; blocking these
        # hosts stops it reading the live site, Actions logs or other repos. Actions' own hosts stay open.
        run: |
          site="$(tr '[:upper:]' '[:lower:]' <<<"${{ github.repository_owner }}").github.io"
          for h in "$site" github.com www.github.com api.github.com raw.githubusercontent.com \
                   codeload.github.com gist.github.com gist.githubusercontent.com; do
            echo "0.0.0.0 $h # lab-block" | sudo tee -a /etc/hosts >/dev/null
          done
          ! curl -sS --max-time 5 -o /dev/null "https://$site/" 2>/dev/null
          sudo rm -f /etc/sudoers.d/runner  # the lab cannot undo the block; the VM is thrown away after the job
          ! sudo -n true 2>/dev/null
      - name: Run lab session
        run: agents/run_lab.sh "${{ matrix.lab }}" "${{ inputs.round }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-r${{ inputs.round }}-${{ matrix.lab }}  # unique per round: all rounds share one run
          path: out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  gate:
    needs: agents
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate deps
        run: python -m pip install jsonschema
      - uses: actions/download-artifact@v4
        with:
          pattern: out-r${{ inputs.round }}-*
          path: artifacts-raw
      - name: Strip round prefix (gate expects out-<lab>)
        run: |
          mkdir -p artifacts
          for d in artifacts-raw/out-r${{ inputs.round }}-*; do [ -d "$d" ] && mv "$d" "artifacts/out-${d##*/out-r${{ inputs.round }}-}"; done
          true
      - name: Validate and copy accepted files
        run: python tools/gate.py --artifacts artifacts --repo . --date "${{ inputs.date }}" --round "${{ inputs.round }}"
      - name: Commit accepted files
        run: |
          tools/commit.sh "gate: ${{ inputs.date }} round ${{ inputs.round }}" labs requests papers reviews gate

  sim:
    needs: gate
    runs-on: ubuntu-latest
    environment: physics
    permissions:
      contents: write
    env:
      SEASON_SEED: ${{ secrets.SEASON_SEED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UNIVERSE_DEPLOY_KEY }}
      - name: Check out the private universe
        run: git clone --depth 1 "git@github.com:${{ github.repository_owner }}/alien-physics-universe.git" _universe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install physics deps
        run: python -m pip install numpy jsonschema pyyaml
      - name: Run requests and update ledger
        run: cd _universe && python -m universe.run_requests --public .. --date "${{ inputs.date }}" --round "${{ inputs.round }}" --seed-env SEASON_SEED
      - name: Commit results and ledger
        run: |
          tools/commit.sh "sim: ${{ inputs.date }} round ${{ inputs.round }}" protocol results ledger
